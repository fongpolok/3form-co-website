<!doctype html>
<!--
  Social preview card for 3formhk.com → public/og-image.png (1200×630).

  This is the source for the picture LinkedIn, WhatsApp, Facebook and X show
  when someone shares a 3formhk.com link. Edit the text below, then regenerate
  from the project root:

    npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1500 \
      "file://$PWD/scripts/og-image/card.html" public/og-image.png

  Colours and fonts follow DESIGN.md (navy-dark, accent-light, Source Serif 4,
  Inter). Keep the important text away from the edges: some apps crop the card
  to a square.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-dark: #001A4A;
    --navy: #002D72;
    --accent-light: #5B9BF0;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', 'PingFang HK', 'PingFang TC', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
    color: #fff;
    font-family: var(--sans);
    position: relative;
    overflow: hidden;
  }
  .card {
    position: relative;
    height: 100%;
    padding: 72px 88px;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 64px; height: 63px; }
  .brand span { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .eyebrow {
    margin-top: 64px;
    display: flex; align-items: center; gap: 14px;
    color: var(--accent-light);
    font-size: 18px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 44px; height: 2px; background: var(--accent-light); }
  h1 {
    margin-top: 22px;
    max-width: 900px;
    font-family: var(--serif);
    font-size: 54px; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em;
  }
  .tc { margin-top: 18px; font-size: 26px; font-weight: 500; color: rgba(255,255,255,0.78); }
  .footer {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(255,255,255,0.18);
    padding-top: 24px;
    font-size: 20px; color: rgba(255,255,255,0.7);
  }
  .footer strong { color: #fff; font-weight: 600; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../../public/logo.white.png" alt="" />
      <span>3form Engineering Co</span>
    </div>
    <div class="eyebrow">Engineering Consulting · Hong Kong</div>
    <h1>Meaningful, measurable, lasting improvement for Hong Kong businesses.</h1>
    <p class="tc">香港工程及管理顧問</p>
    <div class="footer">
      <span>Funding · Lean &amp; Six Sigma · AI &amp; Data · Facility Maintenance</span>
      <strong>3formhk.com</strong>
    </div>
  </div>
</body>
</html>
